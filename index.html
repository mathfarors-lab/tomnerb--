<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartStore - POS & E-Commerce</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top glass-nav shadow-sm py-2">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <div
            class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center"
            style="width: 35px; height: 35px"
          >
            <i class="fa-solid fa-store fs-6"></i>
          </div>
          <h4 class="m-0 fw-bold">
            Smart<span class="text-primary">Store</span>
          </h4>
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <div
            class="mx-auto my-2 my-lg-0 filter-btn-group"
            id="category-filters"
          ></div>
          <div class="d-flex align-items-center gap-4 mt-2 mt-lg-0">
            <div class="form-check form-switch">
              <input
                class="form-check-input fs-5 cursor-pointer"
                type="checkbox"
                id="posModeToggle"
              />
              <label class="form-check-label fw-semibold" for="posModeToggle"
                >POS Mode</label
              >
            </div>
            <button
              class="btn btn-primary rounded-pill px-4 py-2 position-relative shadow-sm fw-semibold"
              data-bs-toggle="offcanvas"
              data-bs-target="#cartOffcanvas"
            >
              <i class="fa-solid fa-bag-shopping me-2"></i>Cart
              <span
                id="cart-badge"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light"
                >0</span
              >
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid px-4 py-5 flex-grow-1">
      <div id="loading-spinner" class="text-center py-5 mt-5">
        <div
          class="spinner-border text-primary mb-3"
          role="status"
          style="width: 3rem; height: 3rem"
        ></div>
        <h5 class="text-muted fw-light">កំពុងទាញទិន្នន័យ</h5>
      </div>
      <div
        id="error-message"
        class="text-center mt-5"
        style="display: none"
      ></div>
      <div class="row g-4" id="product-grid" style="display: none"></div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-3 bg-light text-center border-top">
      <p class="mb-0 text-muted fw-bold">
        <i class="fa-solid fa-bolt text-warning"></i> Powered By Farors
      </p>
    </footer>

    <!-- Cart Offcanvas -->
    <div
      class="offcanvas offcanvas-end border-0 shadow"
      tabindex="-1"
      id="cartOffcanvas"
      style="width: 400px"
    >
      <div class="offcanvas-header bg-light border-bottom">
        <h5 class="offcanvas-title fw-bold" id="cartTitle">
          <i class="fa-solid fa-bag-shopping text-primary"></i> Your Cart
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
        ></button>
      </div>
      <div class="offcanvas-body d-flex flex-column p-0 bg-light">
        <div id="cart-items" class="flex-grow-1 overflow-auto p-3">
          <div class="text-center text-muted mt-5">
            <i class="fa-solid fa-cart-arrow-down fs-1 mb-3 opacity-50"></i>
            <p>មិនទាន់មានទំនិញទេ</p>
          </div>
        </div>

        <!-- កន្លែងបញ្ចូលព័ត៌មានអ្នកទិញ -->
        <div
          class="p-3 bg-white border-top shadow-sm"
          id="customer-info-section"
        >
          <h6 class="fw-bold mb-2 text-dark">
            <i class="fa-solid fa-address-card me-1 text-primary"></i>
            ព័ត៌មានអ្នកទិញ
          </h6>
          <input
            type="tel"
            id="customer-phone"
            class="form-control mb-2"
            placeholder="បញ្ចូលលេខទូរស័ព្ទ *"
            required
          />
          <textarea
            id="customer-location"
            class="form-control"
            rows="2"
            placeholder="បញ្ចូលទីតាំងច្បាស់លាស់ *"
            required
          ></textarea>
        </div>

        <div class="p-4 bg-white border-top shadow-lg">
          <div class="d-flex justify-content-between mb-3">
            <span class="fs-5 text-muted">Total</span
            ><span class="fs-3 fw-bold text-dark" id="cart-total">$0.00</span>
          </div>
          <button
            class="btn btn-primary w-100 py-3 rounded-3 fw-bold fs-5 shadow-sm"
            id="checkout-btn"
          >
            <i class="fa-regular fa-credit-card"></i> Pay Now
          </button>
        </div>
      </div>
    </div>

    <!-- Payment Bank Selection Modal -->
    <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-light border-bottom-0">
            <h5 class="modal-title fw-bold">ជ្រើសរើសធនាគារដើម្បីបង់ប្រាក់</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body text-center p-4">
            <p class="fs-5 text-muted mb-1">ទឹកប្រាក់ត្រូវបង់សរុប៖</p>
            <h1 class="text-danger fw-bold mb-4" id="modal-total-amount">
              $0.00
            </h1>

            <div class="d-grid gap-3">
              <button
                class="btn btn-primary py-3 fw-bold fs-5 shadow-sm rounded-3"
                onclick="processBankPayment('ABA Bank')"
              >
                <i class="fa-solid fa-building-columns me-2"></i> បង់តាមរយៈ ABA
                Bank
              </button>
              <button
                class="btn btn-dark py-3 fw-bold fs-5 shadow-sm rounded-3"
                onclick="processBankPayment('ACLEDA Bank')"
              >
                <i class="fa-solid fa-building-columns me-2"></i> បង់តាមរយៈ
                ACLEDA Bank
              </button>
              <button
                class="btn btn-success py-3 fw-bold fs-5 shadow-sm rounded-3"
                onclick="processBankPayment('Wing Bank')"
              >
                <i class="fa-solid fa-building-columns me-2"></i> បង់តាមរយៈ Wing
                Bank
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const SHEET_URL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vRtHQITBdbzdbRvUASp2wIn6ficZcq7IiYmyhIHMXNFMmNYZ8qwnIJXdi-a6Nz_dm0E3ArLIw8n1y76/pub?output=csv";
      const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbw59Co5i8dxJ7yijisHHweGRSKK-VSx6lnUf2paqkIz8h-3hIKNRvSe_ScL6U2bmFcWUw/exec";

      const TELEGRAM_BOT_TOKEN =
        "8267523556:AAFzqBMutjD4PsFuZYvDxXt7d7VL0W-pKEk";
      const TELEGRAM_CHAT_ID = "1382677305";
      const STORE_LOGO_URL =
        "https://img.freepik.com/free-vector/receipt-icon-with-check-mark-flat-style_1150-35002.jpg";

      let allProducts = [];
      let cart = [];
      let isPOSMode = false;
      let paymentLink = "https://pay.ababank.com/oRF8/yxsuiw51";
      let sellerTelegramLink = "https://t.me/yourusername"; // Default

      document.addEventListener("DOMContentLoaded", () => {
        loadCart();
        Papa.parse(SHEET_URL, {
          download: true,
          header: true,
          skipEmptyLines: true,
          transformHeader: function (h) {
            return h.trim().toLowerCase();
          },
          complete: function (results) {
            try {
              processData(results.data);
            } catch (e) {
              showError("មានបញ្ហាក្នុងការរៀបចំទិន្នន័យ៖ " + e.message);
            }
          },
          error: function (error) {
            showError("មិនអាចភ្ជាប់ទៅកាន់ Google Sheets បានទេ។");
          },
        });

        document
          .getElementById("posModeToggle")
          .addEventListener("change", togglePOSMode);
        document
          .getElementById("checkout-btn")
          .addEventListener("click", checkout);
      });

      function showError(msg) {
        document.getElementById("loading-spinner").style.display = "none";
        const errorDiv = document.getElementById("error-message");
        errorDiv.style.display = "block";
        errorDiv.innerHTML = `<div class="alert alert-danger d-inline-block"><i class="fa-solid fa-triangle-exclamation"></i> ${msg}</div>`;
      }

      function processData(data) {
        if (data.length > 0) {
          if (data[0]["payment link"]) paymentLink = data[0]["payment link"];
          // ទាញយក Telegram link ពី Sheets (ឈ្មោះ column 'telegram' ឫ 'telegram link')
          if (data[0]["telegram"]) sellerTelegramLink = data[0]["telegram"];
          else if (data[0]["telegram link"])
            sellerTelegramLink = data[0]["telegram link"];
        }

        allProducts = data
          .map((item) => {
            let rawPrice = String(item["price"] || "0").replace(/[^0-9.]/g, "");
            let rawOldPrice = String(item["old price"] || "").replace(
              /[^0-9.]/g,
              "",
            );
            let rawName = item["name"] || "Unnamed Product";
            let rawCategory = item["category"]
              ? item["category"].trim()
              : "General";

            return {
              id: item["id"] || "",
              name: rawName,
              category: rawCategory,
              image:
                item["image url"] ||
                "https://via.placeholder.com/300?text=No+Image",
              desc: item["description"] || "",
              price: parseFloat(rawPrice) || 0,
              oldPrice: rawOldPrice ? parseFloat(rawOldPrice) : null,
              stock: parseInt(item["stock"]) || 0,
            };
          })
          .filter((p) => p.id !== "");

        if (allProducts.length === 0) {
          showError("មិនមានទិន្នន័យទំនិញនៅក្នុង Google Sheets នោះទេ។");
          return;
        }

        document.getElementById("loading-spinner").style.display = "none";
        document.getElementById("product-grid").style.display = "flex";

        generateCategories();
        renderProducts(allProducts);
        validateCartAgainstStock();
      }

      function saveCart() {
        localStorage.setItem("smartStoreCart", JSON.stringify(cart));
      }
      function loadCart() {
        const savedCart = localStorage.getItem("smartStoreCart");
        if (savedCart) {
          cart = JSON.parse(savedCart);
          updateCartUI();
        }
      }

      function validateCartAgainstStock() {
        cart = cart.filter((cartItem) => {
          const product = allProducts.find((p) => p.id === cartItem.id);
          if (!product || product.stock <= 0) return false;
          cartItem.price = product.price;
          cartItem.name = product.name;
          cartItem.image = product.image;
          if (cartItem.qty > product.stock) cartItem.qty = product.stock;
          return true;
        });
        saveCart();
        updateCartUI();
      }

      function generateCategories() {
        const container = document.getElementById("category-filters");
        const categories = [
          "All",
          ...new Set(allProducts.map((p) => p.category).filter(Boolean)),
        ];
        container.innerHTML = "";
        categories.forEach((cat, index) => {
          const btn = document.createElement("button");
          btn.className = `filter-btn ${index === 0 ? "active" : ""}`;
          btn.textContent = cat;
          btn.onclick = (e) => filterProducts(cat, e.target);
          container.appendChild(btn);
        });
      }

      function filterProducts(category, clickedBtn) {
        document
          .querySelectorAll(".filter-btn")
          .forEach((btn) => btn.classList.remove("active"));
        clickedBtn.classList.add("active");
        if (category === "All") renderProducts(allProducts);
        else renderProducts(allProducts.filter((p) => p.category === category));
      }

      function renderProducts(productsToRender) {
        const grid = document.getElementById("product-grid");
        grid.innerHTML = "";
        productsToRender.forEach((p) => {
          const inStock = p.stock > 0;
          const cardHTML = `
                <div class="col-12 col-sm-6 col-md-4 col-xl-3">
                    <div class="product-card">
                        <div class="img-container">
                            <span class="badge-stock ${inStock ? "" : "text-danger"}"><i class="fa-solid fa-box me-1"></i> ${inStock ? p.stock + " In Stock" : "Out of Stock"}</span>
                            <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                        </div>
                        <h4 class="product-title">${p.name}</h4>
                        <p class="product-desc">${p.desc}</p>
                        <div class="price-box">
                            <span class="current-price">$${p.price.toFixed(2)}</span>
                            ${p.oldPrice > p.price ? `<span class="old-price">$${p.oldPrice.toFixed(2)}</span>` : ""}
                        </div>
                        <button class="btn-add w-100" onclick="addToCart('${p.id}')" ${!inStock ? "disabled" : ""}>
                            <i class="fa-solid fa-cart-plus me-1"></i> ${inStock ? "Add to Cart" : "Sold Out"}
                        </button>
                    </div>
                </div>
            `;
          grid.innerHTML += cardHTML;
        });
      }

      function addToCart(id) {
        const product = allProducts.find((p) => p.id === id);
        const existingItem = cart.find((item) => item.id === id);
        if (existingItem) {
          if (existingItem.qty < product.stock) existingItem.qty++;
          else {
            alert("អស់ស្តុកហើយ!");
            return;
          }
        } else {
          cart.push({ ...product, qty: 1 });
        }
        updateCartUI();
        saveCart();
      }

      function updateCartUI() {
        const container = document.getElementById("cart-items");
        const badge = document.getElementById("cart-badge");
        const totalEl = document.getElementById("cart-total");
        container.innerHTML = "";
        let total = 0,
          count = 0;

        if (cart.length === 0) {
          container.innerHTML = `<div class="text-center text-muted mt-5"><i class="fa-solid fa-cart-arrow-down fs-1 mb-3 opacity-50"></i><p>មិនទាន់មានទំនិញទេ</p></div>`;
        } else {
          cart.forEach((item, index) => {
            total += item.price * item.qty;
            count += item.qty;
            container.innerHTML += `
                    <div class="cart-item shadow-sm">
                        <img src="${item.image}" class="cart-img" onerror="this.src='https://via.placeholder.com/70'">
                        <div class="flex-grow-1 overflow-hidden">
                            <h6 class="m-0 fw-bold text-truncate">${item.name}</h6>
                            <div class="text-primary fw-bold mt-1">$${(item.price * item.qty).toFixed(2)}</div>
                        </div>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                            <span class="px-2 fw-bold text-dark">${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
          });
        }
        badge.innerText = count;
        totalEl.innerText = `$${total.toFixed(2)}`;
      }

      function updateQty(index, change) {
        const item = cart[index];
        const product = allProducts.find((p) => p.id === item.id);
        if (product && change === 1 && item.qty >= product.stock) {
          alert("លើសចំនួនស្តុក!");
          return;
        }
        item.qty += change;
        if (item.qty <= 0) cart.splice(index, 1);
        updateCartUI();
        saveCart();
      }

      function togglePOSMode() {
        isPOSMode = document.getElementById("posModeToggle").checked;
        document.body.classList.toggle("pos-mode", isPOSMode);

        // លាក់ប្រអប់បំពេញព័ត៌មាន បើជា POS Mode
        document.getElementById("customer-info-section").style.display =
          isPOSMode ? "none" : "block";

        document.getElementById("cartTitle").innerHTML = isPOSMode
          ? '<i class="fa-solid fa-desktop text-success"></i> POS Register'
          : '<i class="fa-solid fa-bag-shopping text-primary"></i> Your Cart';

        const btn = document.getElementById("checkout-btn");
        btn.innerHTML = isPOSMode
          ? '<i class="fa-solid fa-print"></i> Print & Pay'
          : '<i class="fa-regular fa-credit-card"></i> Pay Now';
        btn.className = isPOSMode
          ? "btn btn-success w-100 py-3 rounded-3 fw-bold fs-5 shadow-sm"
          : "btn btn-primary w-100 py-3 rounded-3 fw-bold fs-5 shadow-sm";
      }

      function checkout() {
        if (cart.length === 0) {
          alert("រទេះទទេស្អាត! សូមជ្រើសរើសទំនិញជាមុនសិន។");
          return;
        }

        // ត្រួតពិនិត្យលេខទូរស័ព្ទ និងទីតាំង (លុះត្រាតែមិនមែន POS)
        if (!isPOSMode) {
          const phone = document.getElementById("customer-phone").value.trim();
          const location = document
            .getElementById("customer-location")
            .value.trim();
          if (!phone || !location) {
            alert("សូមបំពេញលេខទូរស័ព្ទ និង ទីតាំងឲ្យបានច្បាស់លាស់សិន!");
            return;
          }
        }

        const totalAmountText = document.getElementById("cart-total").innerText;

        if (isPOSMode) {
          sendTelegramNotification(
            "សាច់ប្រាក់សុទ្ធ (POS Mode)",
            totalAmountText,
          );
          alert(
            `ទូទាត់ជោគជ័យ!\nសរុប: ${totalAmountText}\nកំពុងព្រីនវិក្កយបត្រ...`,
          );
          clearCartLocalOnly();
        } else {
          const cartEl = document.getElementById("cartOffcanvas");
          const cartInstance = bootstrap.Offcanvas.getInstance(cartEl);
          if (cartInstance) cartInstance.hide();
          document.getElementById("modal-total-amount").innerText =
            totalAmountText;
          const paymentModal = new bootstrap.Modal(
            document.getElementById("paymentModal"),
          );
          paymentModal.show();
        }
      }

      function sendTelegramNotification(bankName, totalAmountText) {
        if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;

        const phone = isPOSMode
          ? "POS (អតិថិជនផ្ទាល់)"
          : document.getElementById("customer-phone").value.trim();
        const location = isPOSMode
          ? "ហាងផ្ទាល់"
          : document.getElementById("customer-location").value.trim();

        const now = new Date();
        const dateStr = now.toLocaleDateString("en-GB");
        const timeStr = now.toLocaleTimeString("en-US");
        const orderId = "INV" + Date.now().toString().slice(-6);

        let itemsList = cart
          .map(
            (item, index) =>
              `${index + 1}. ${item.name}\n   └ ${item.qty} x $${item.price.toFixed(2)} = $${(item.price * item.qty).toFixed(2)}`,
          )
          .join("\n");

        // វេចខ្ចប់ទិន្នន័យ Cart ដើម្បីបញ្ជូនទៅ Telegram ឲ្យ Apps Script ដឹងពេលកាត់ស្តុក
        const cartDataString = JSON.stringify(
          cart.map((c) => ({ id: c.id, qty: c.qty })),
        );

        const caption =
          `🧾 <b>វិក្កយបត្រថ្មី (New Invoice)</b>\n` +
          `━━━━━━━━━━━━━━━━━━━━\n` +
          `🔢 <b>លេខរៀង:</b> #${orderId}\n` +
          `📅 <b>កាលបរិច្ឆេទ:</b> ${dateStr}\n` +
          `⏰ <b>ម៉ោង:</b> ${timeStr}\n` +
          `🏦 <b>វិធីបង់ប្រាក់:</b> ${bankName}\n` +
          `📞 <b>លេខទូរស័ព្ទ:</b> ${phone}\n` +
          `📍 <b>ទីតាំង:</b> ${location}\n` +
          `━━━━━━━━━━━━━━━━━━━━\n` +
          `<b>បញ្ជីទំនិញ:</b>\n${itemsList}\n` +
          `━━━━━━━━━━━━━━━━━━━━\n` +
          `💰 <b>ទឹកប្រាក់សរុប:</b> <b>${totalAmountText}</b>\n\n` +
          `<i>⚠️ ចុច Confirm ដើម្បីកាត់ស្តុក | Reject បដិសេធ</i>`;

        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`;
        const payload = {
          chat_id: TELEGRAM_CHAT_ID,
          photo: STORE_LOGO_URL,
          caption: caption,
          parse_mode: "HTML",
          reply_markup: {
            inline_keyboard: [
              [
                // បញ្ជូន orderId ទៅកាន់ Webhook ពេលចុច
                { text: "✅ Confirm", callback_data: `confirm_${orderId}` },
                { text: "❌ Reject", callback_data: `reject_${orderId}` },
              ],
              [
                // ទាញយក Link ពី Google Sheets
                { text: "💬 Contact Us", url: sellerTelegramLink },
              ],
            ],
          },
        };

        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        }).catch((err) => console.error(err));
      }

      function processBankPayment(bankName) {
        const totalAmountText = document.getElementById("cart-total").innerText;
        sendTelegramNotification(bankName, totalAmountText);

        if (bankName === "ABA Bank") window.open(paymentLink, "_blank");
        else alert(`កំពុងដំណើរការទៅកាន់កម្មវិធី ${bankName}...`);

        const modalEl = document.getElementById("paymentModal");
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
        clearCartLocalOnly();
      }

      // ដោយសារចង់អោយកាត់ស្តុកនៅពេលចុច Confirm លើ Telegram យើងមិនកាត់វាឥឡូវទេ យើងគ្រាន់តែលុបពីកន្រ្តក
      function clearCartLocalOnly() {
        // បញ្ជូនទៅ Apps script អោយដឹងសិនក៏បាន តែបើចង់កាត់ពី Telegram សុទ្ធ ទុក Script អោយធ្វើការងារនេះ (តម្រូវអោយរៀបចំ Webhook)
        // updateStockInGoogleSheet(); <- លាក់សិន ឬ ប្រើសម្រាប់បញ្ជូនជា Pending

        cart = [];
        updateCartUI();
      }
    </script>
  </body>
</html>
