<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TomnerbStore - POS & E-Commerce</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css">
    
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top glass-nav shadow-sm py-2">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <div
            class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center"
            style="width: 35px; height: 35px"
          >
            <i class="fa-solid fa-store fs-6"></i>
          </div>
          <h4 class="m-0 fw-bold">
            Tomnerb<span class="text-primary">Store</span>
          </h4>
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
          <div
            class="mx-auto my-2 my-lg-0 filter-btn-group"
            id="category-filters"
          ></div>
          <div class="d-flex align-items-center gap-4 mt-2 mt-lg-0">
            <div class="form-check form-switch">
              <input
                class="form-check-input fs-5 cursor-pointer"
                type="checkbox"
                id="posModeToggle"
              />
              <label class="form-check-label fw-semibold" for="posModeToggle"
                >POS Mode</label
              >
            </div>
            <button
              class="btn btn-primary rounded-pill px-4 py-2 position-relative shadow-sm fw-semibold"
              data-bs-toggle="offcanvas"
              data-bs-target="#cartOffcanvas"
            >
              <i class="fa-solid fa-bag-shopping me-2"></i>Cart
              <span
                id="cart-badge"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light"
                >0</span
              >
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid px-4 py-5">
      <div id="loading-spinner" class="text-center py-5 mt-5">
        <div
          class="spinner-border text-primary mb-3"
          role="status"
          style="width: 3rem; height: 3rem"
        ></div>
        <h5 class="text-muted fw-light">Reload</h5>
      </div>
      <div
        id="error-message"
        class="text-center mt-5"
        style="display: none"
      ></div>
      <div class="row g-4" id="product-grid" style="display: none"></div>
    </main>

    <!-- Cart Offcanvas -->
    <div
      class="offcanvas offcanvas-end border-0 shadow"
      tabindex="-1"
      id="cartOffcanvas"
      style="width: 400px"
    >
      <div class="offcanvas-header bg-light border-bottom">
        <h5 class="offcanvas-title fw-bold" id="cartTitle">
          <i class="fa-solid fa-bag-shopping text-primary"></i> Your Cart
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
        ></button>
      </div>
      <div class="offcanvas-body d-flex flex-column p-0 bg-light">
        <div id="cart-items" class="flex-grow-1 overflow-auto p-3">
          <div class="text-center text-muted mt-5">
            <i class="fa-solid fa-cart-arrow-down fs-1 mb-3 opacity-50"></i>
            <p>មិនទាន់មានទំនិញទេ</p>
          </div>
        </div>
        <div
          class="p-4 bg-white border-top shadow-lg"
          style="border-radius: 20px 20px 0 0"
        >
          <div class="d-flex justify-content-between mb-3">
            <span class="fs-5 text-muted">Total</span
            ><span class="fs-3 fw-bold text-dark" id="cart-total">$0.00</span>
          </div>
          <button
            class="btn btn-primary w-100 py-3 rounded-3 fw-bold fs-5 shadow-sm"
            id="checkout-btn"
          >
            <i class="fa-regular fa-credit-card"></i> Pay Now
          </button>
        </div>
      </div>
    </div>

    <!-- Payment Bank Selection Modal -->
    <div
      class="modal fade"
      id="paymentModal"
      tabindex="-1"
      aria-labelledby="paymentModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-light border-bottom-0">
            <h5 class="modal-title fw-bold" id="paymentModalLabel">
              ជ្រើសរើសធនាគារដើម្បីបង់ប្រាក់
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body text-center p-4">
            <p class="fs-5 text-muted mb-1">ទឹកប្រាក់ត្រូវបង់សរុប៖</p>
            <h1 class="text-danger fw-bold mb-4" id="modal-total-amount">
              $0.00
            </h1>

            <div class="d-grid gap-3">
              <button
                class="btn btn-aba py-3 fw-bold fs-5 shadow-sm rounded-3"
                onclick="processBankPayment('ABA Bank')"
              >
                <i class="fa-solid fa-building-columns me-2"></i> បង់តាមរយៈ ABA
                Bank
              </button>

              <button
                class="btn btn-acleda py-3 fw-bold fs-5 shadow-sm rounded-3"
                onclick="processBankPayment('ACLEDA Bank')"
              >
                <i class="fa-solid fa-building-columns me-2"></i> បង់តាមរយៈ
                ACLEDA Bank
              </button>

              <button
                class="btn btn-wing py-3 fw-bold fs-5 shadow-sm rounded-3"
                onclick="processBankPayment('Wing Bank')"
              >
                <i class="fa-solid fa-building-columns me-2"></i> បង់តាមរយៈ Wing
                Bank
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const SHEET_URL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vRtHQITBdbzdbRvUASp2wIn6ficZcq7IiYmyhIHMXNFMmNYZ8qwnIJXdi-a6Nz_dm0E3ArLIw8n1y76/pub?output=csv";

      let allProducts = [];
      let cart = [];
      let isPOSMode = false;

      let paymentLink = "https://pay.ababank.com/oRF8/yxsuiw51";

      document.addEventListener("DOMContentLoaded", () => {
        // ទាញទិន្នន័យពី LocalStorage មកវិញពេលបើក Browser
        loadCart();

        Papa.parse(SHEET_URL, {
          download: true,
          header: true,
          skipEmptyLines: true,
          transformHeader: function (h) {
            return h.trim().toLowerCase();
          },
          complete: function (results) {
            try {
              processData(results.data);
            } catch (e) {
              showError("មានបញ្ហាក្នុងការរៀបចំទិន្នន័យ៖ " + e.message);
            }
          },
          error: function (error) {
            showError(
              "មិនអាចភ្ជាប់ទៅកាន់ Google Sheets បានទេ។ សូមពិនិត្យ Internet ឬ Link ម្តងទៀត!",
            );
          },
        });

        document
          .getElementById("posModeToggle")
          .addEventListener("change", togglePOSMode);
        document
          .getElementById("checkout-btn")
          .addEventListener("click", checkout);
      });

      function showError(msg) {
        document.getElementById("loading-spinner").style.display = "none";
        const errorDiv = document.getElementById("error-message");
        errorDiv.style.display = "block";
        errorDiv.innerHTML = `<div class="alert alert-danger d-inline-block"><i class="fa-solid fa-triangle-exclamation"></i> ${msg}</div>`;
      }

      function processData(data) {
        if (data.length > 0 && data[0]["payment link"]) {
          paymentLink = data[0]["payment link"];
        }

        allProducts = data
          .map((item) => {
            let rawPrice = String(item["price"] || "0").replace(/[^0-9.]/g, "");
            let rawOldPrice = String(item["old price"] || "").replace(
              /[^0-9.]/g,
              "",
            );

            let rawName = item["name"] || "Unnamed Product";
            let rawCategory = item["category"] ? item["category"].trim() : "";

            let nameLower = rawName.toLowerCase();
            const drinkKeywords = [
              "coffee",
              "tea",
              "water",
              "juice",
              "milk",
              "drink",
              "espresso",
              "roast",
              "coca",
              "pepsi",
              "កាហ្វេ",
              "តែ",
              "ទឹក",
              "ភេសជ្ជៈ",
            ];
            const foodKeywords = [
              "rice",
              "burger",
              "pizza",
              "noodle",
              "bread",
              "cake",
              "food",
              "snack",
              "បាយ",
              "នំ",
              "សាច់",
              "អាហារ",
            ];

            let finalCategory = rawCategory;

            if (finalCategory === "ភេសជ្ជៈ") finalCategory = "Drink";
            else if (finalCategory === "អាហារ") finalCategory = "Food";

            if (finalCategory === "") {
              if (drinkKeywords.some((kw) => nameLower.includes(kw))) {
                finalCategory = "Drink";
              } else if (foodKeywords.some((kw) => nameLower.includes(kw))) {
                finalCategory = "Food";
              } else {
                finalCategory = "General";
              }
            }

            return {
              id: item["id"] || "",
              name: rawName,
              category: finalCategory,
              image:
                item["image url"] ||
                "https://via.placeholder.com/300?text=No+Image",
              desc: item["description"] || "",
              price: parseFloat(rawPrice) || 0,
              oldPrice: rawOldPrice ? parseFloat(rawOldPrice) : null,
              stock: parseInt(item["stock"]) || 0,
            };
          })
          .filter((p) => p.id !== "");

        if (allProducts.length === 0) {
          showError("មិនមានទិន្នន័យទំនិញនៅក្នុង Google Sheets នោះទេ។");
          return;
        }

        document.getElementById("loading-spinner").style.display = "none";
        document.getElementById("product-grid").style.display = "flex";

        generateCategories();
        renderProducts(allProducts);

        // ពេលទាញ Product មកចប់ ឆែកមើលក្រែងលោមានទំនិញខ្លះក្នុង Cart អស់ស្តុក
        validateCartAgainstStock();
      }

      // --- អនុគមន៍ថ្មីសម្រាប់ Save និង Load ទិន្នន័យ (LocalStorage) ---
      function saveCart() {
        // បម្លែង Array Cart ទៅជា String ហើយ Save ចូលក្នុង Browser
        localStorage.setItem("smartStoreCart", JSON.stringify(cart));
      }

      function loadCart() {
        const savedCart = localStorage.getItem("smartStoreCart");
        if (savedCart) {
          cart = JSON.parse(savedCart);
          updateCartUI();
        }
      }

      function validateCartAgainstStock() {
        // លុបទំនិញក្នុង Cart ចោល បើទំនិញនោះត្រូវបានលុបចេញពី Sheet ឬអស់ស្តុក
        cart = cart.filter((cartItem) => {
          const product = allProducts.find((p) => p.id === cartItem.id);
          if (!product || product.stock <= 0) return false;
          // Update តម្លៃចុងក្រោយក្រែងលោក្នុង Sheet មានការផ្លាស់ប្តូរតម្លៃ
          cartItem.price = product.price;
          cartItem.name = product.name;
          cartItem.image = product.image;
          // បើក្នុង Cart ច្រើនជាងស្តុកក្នុង Sheet ត្រូវទម្លាក់ចុះមកត្រឹមស្តុកដែលនៅសល់
          if (cartItem.qty > product.stock) cartItem.qty = product.stock;
          return true;
        });
        saveCart();
        updateCartUI();
      }
      // -----------------------------------------------------------

      function generateCategories() {
        const container = document.getElementById("category-filters");
        const categories = [
          "All",
          ...new Set(allProducts.map((p) => p.category).filter(Boolean)),
        ];
        container.innerHTML = "";
        categories.forEach((cat, index) => {
          const btn = document.createElement("button");
          btn.className = `filter-btn ${index === 0 ? "active" : ""}`;
          btn.textContent = cat;
          btn.onclick = (e) => filterProducts(cat, e.target);
          container.appendChild(btn);
        });
      }

      function filterProducts(category, clickedBtn) {
        document
          .querySelectorAll(".filter-btn")
          .forEach((btn) => btn.classList.remove("active"));
        clickedBtn.classList.add("active");
        if (category === "All") renderProducts(allProducts);
        else renderProducts(allProducts.filter((p) => p.category === category));
      }

      function renderProducts(productsToRender) {
        const grid = document.getElementById("product-grid");
        grid.innerHTML = "";
        productsToRender.forEach((p) => {
          const inStock = p.stock > 0;
          const cardHTML = `
                  <div class="col-12 col-sm-6 col-md-4 col-xl-3">
                      <div class="product-card">
                          <div class="img-container">
                              <span class="badge-stock ${inStock ? "" : "text-danger"}"><i class="fa-solid fa-box me-1"></i> ${inStock ? p.stock + " In Stock" : "Out of Stock"}</span>
                              <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                          </div>
                          <h4 class="product-title">${p.name}</h4>
                          <p class="product-desc">${p.desc}</p>
                          <div class="price-box">
                              <span class="current-price">$${p.price.toFixed(2)}</span>
                              ${p.oldPrice > p.price ? `<span class="old-price">$${p.oldPrice.toFixed(2)}</span>` : ""}
                          </div>
                          <button class="btn-add w-100" onclick="addToCart('${p.id}')" ${!inStock ? "disabled" : ""}>
                              <i class="fa-solid fa-cart-plus me-1"></i> ${inStock ? "Add to Cart" : "Sold Out"}
                          </button>
                      </div>
                  </div>
              `;
          grid.innerHTML += cardHTML;
        });
      }

      function addToCart(id) {
        const product = allProducts.find((p) => p.id === id);
        const existingItem = cart.find((item) => item.id === id);
        if (existingItem) {
          if (existingItem.qty < product.stock) existingItem.qty++;
          else {
            alert("អស់ស្តុកហើយ!");
            return;
          }
        } else {
          cart.push({ ...product, qty: 1 });
        }
        updateCartUI();
        saveCart(); // Save ពេល Add ថ្មី
      }

      function updateCartUI() {
        const container = document.getElementById("cart-items");
        const badge = document.getElementById("cart-badge");
        const totalEl = document.getElementById("cart-total");
        container.innerHTML = "";
        let total = 0,
          count = 0;

        if (cart.length === 0) {
          container.innerHTML = `<div class="text-center text-muted mt-5"><i class="fa-solid fa-cart-arrow-down fs-1 mb-3 opacity-50"></i><p>មិនទាន់មានទំនិញទេ</p></div>`;
        } else {
          cart.forEach((item, index) => {
            total += item.price * item.qty;
            count += item.qty;
            container.innerHTML += `
                      <div class="cart-item shadow-sm">
                          <img src="${item.image}" class="cart-img" onerror="this.src='https://via.placeholder.com/70'">
                          <div class="flex-grow-1 overflow-hidden">
                              <h6 class="m-0 fw-bold text-truncate">${item.name}</h6>
                              <div class="text-primary fw-bold mt-1">$${(item.price * item.qty).toFixed(2)}</div>
                          </div>
                          <div class="qty-control">
                              <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                              <span class="px-2 fw-bold text-dark">${item.qty}</span>
                              <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                          </div>
                      </div>
                  `;
          });
        }
        badge.innerText = count;
        totalEl.innerText = `$${total.toFixed(2)}`;
      }

      function updateQty(index, change) {
        const item = cart[index];
        const product = allProducts.find((p) => p.id === item.id);

        // ប្រសិនបើកូដអត់ទាន់មាន Product ពេញលេញទេ អនុញ្ញាតឲ្យបន្ថយសិន
        if (product) {
          if (change === 1 && item.qty >= product.stock) {
            alert("លើសចំនួនស្តុក!");
            return;
          }
        }

        item.qty += change;
        if (item.qty <= 0) cart.splice(index, 1);

        updateCartUI();
        saveCart(); // Save ពេលបូកដកចំនួន
      }

      function togglePOSMode() {
        isPOSMode = document.getElementById("posModeToggle").checked;
        document.body.classList.toggle("pos-mode", isPOSMode);
        document.getElementById("cartTitle").innerHTML = isPOSMode
          ? '<i class="fa-solid fa-desktop text-success"></i> POS Register'
          : '<i class="fa-solid fa-bag-shopping text-primary"></i> Your Cart';
        const btn = document.getElementById("checkout-btn");
        btn.innerHTML = isPOSMode
          ? '<i class="fa-solid fa-print"></i> Print & Pay'
          : '<i class="fa-regular fa-credit-card"></i> Pay Now';
        btn.className = isPOSMode
          ? "btn btn-success w-100 py-3 rounded-3 fw-bold fs-5 shadow-sm"
          : "btn btn-primary w-100 py-3 rounded-3 fw-bold fs-5 shadow-sm";
      }

      function checkout() {
        if (cart.length === 0) {
          alert("រទេះទទេស្អាត! សូមជ្រើសរើសទំនិញជាមុនសិន។");
          return;
        }

        const totalAmountText = document.getElementById("cart-total").innerText;

        if (isPOSMode) {
          alert(
            `ទូទាត់ជោគជ័យ!\nសរុប: ${totalAmountText}\nកំពុងព្រីនវិក្កយបត្រ...`,
          );
          clearCart();
        } else {
          const cartEl = document.getElementById("cartOffcanvas");
          const cartInstance = bootstrap.Offcanvas.getInstance(cartEl);
          if (cartInstance) cartInstance.hide();

          document.getElementById("modal-total-amount").innerText =
            totalAmountText;
          const paymentModal = new bootstrap.Modal(
            document.getElementById("paymentModal"),
          );
          paymentModal.show();
        }
      }

      function processBankPayment(bankName) {
        if (bankName === "ABA Bank") {
          window.open(paymentLink, "_blank");
        } else {
          alert(
            `កំពុងដំណើរការទៅកាន់កម្មវិធី ${bankName}...\nសូមធ្វើការស្កេន ឬ វាយបញ្ចូលគណនី។`,
          );
        }

        const modalEl = document.getElementById("paymentModal");
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();

        clearCart();
      }

      function clearCart() {
        cart = [];
        updateCartUI();
      }
    </script>
  </body>
</html>
